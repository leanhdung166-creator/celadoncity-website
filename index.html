<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celadon City</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Form đăng ký -->
  <section class="register">
    <h2>Đăng ký để nhận ngay mức giá ưu đãi nhất</h2>
    <ul>
      <li>Ưu đãi cực hấp dẫn</li>
      <li>Hỗ trợ vay ngân hàng</li>
      <li>Chiết khấu tốt nhất</li>
    </ul>
    <form>
      <input type="text" placeholder="Tên của bạn" required>
      <input type="email" placeholder="Email" required>
      <button type="submit">ĐĂNG KÝ NGAY</button>
    </form>
  </section>

  <!-- Tổng thể dự án -->
  <section class="overview">
    <h2>TỔNG THỂ MẶT BẰNG DỰ ÁN CELADON CITY</h2>
    <div class="images">
      <figure>
        <img src="images/image-1.jpg" alt="Mặt bằng 1">
        <figcaption>
          <h3>Mặt bằng 1</h3>
          <p>Tọa lạc trên diện tích 82ha, Celadon City hứa hẹn sẽ là một khu đô thị sinh thái lý tưởng với hệ thống cây xanh và mặt nước rộng lớn.</p>
        </figcaption>
      </figure>
      <figure>
        <img src="images/image-2.jpg" alt="Mặt bằng 2">
        <figcaption>
          <h3>Mặt bằng 2</h3>
          <p>Quy hoạch bài bản với nhiều phân khu chức năng, đáp ứng nhu cầu sống, học tập, làm việc và giải trí của cư dân.</p>
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- Tiện ích -->
  <section class="features">
    <h2>TIỆN ÍCH DỰ ÁN</h2>
    <div class="images">
      <figure>
        <img src="images/image-3.jpg" alt="Tiện ích 1">
        <figcaption>
          <h3>Tiện ích 1</h3>
          <p>Khu công viên trung tâm rộng lớn, là nơi lý tưởng để đi dạo, thể dục và các hoạt động cộng đồng.</p>
        </figcaption>
      </figure>
      <figure>
        <img src="images/image-4.jpg" alt="Tiện ích 2">
        <figcaption>
          <h3>Tiện ích 2</h3>
          <p>Trung tâm thương mại hiện đại, đáp ứng mọi nhu cầu mua sắm và giải trí của cư dân.</p>
        </figcaption>
      </figure>
      <figure>
        <img src="images/image-5.jpg" alt="Tiện ích 3">
        <figcaption>
          <h3>Tiện ích 3</h3>
          <p>Trường học quốc tế với cơ sở vật chất hiện đại, mang lại môi trường học tập chất lượng cao cho thế hệ trẻ.</p>
        </figcaption>
      </figure>
      <figure>
        <img src="images/image-6.jpg" alt="Tiện ích 4">
        <figcaption>
          <h3>Tiện ích 4</h3>
          <p>Khu thể thao đa năng với hồ bơi, sân tennis, phòng gym, đáp ứng nhu cầu rèn luyện sức khỏe.</p>
        </figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
